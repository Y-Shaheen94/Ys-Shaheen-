<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yousef Shaheen | Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .profile-title {
            font-size: 1.8rem;
            color: #58a6ff;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .subtitle {
            font-size: 1rem;
            color: #8b949e;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .quote {
            background: #21262d;
            border-right: 4px solid #238636;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #a3b3c2;
            margin-bottom: 2rem;
            font-style: italic;
            text-align: right;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 0.8rem 1.2rem;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #238636;
            color: #ffffff;
            border-color: #238636;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="profile-title">👑 Developer</h1>
        <p class="subtitle">Yousef Z. A. Shaheen</p>

        <div class="quote">
            "I'm not a phase—I'm the ignition. The old me became fuel for the legend I'm building."
        </div>

        <div class="links">
            <a href="https://github.com/Y-Shaheen94" class="btn" target="_blank">💻 GitHub Profile</a>
            <a href="https://y-shaheen94.github.io/" class="btn" target="_blank">🌐 Main Website</a>
            <a href="https://t.me/" class="btn" target="_blank">💬 Telegram</a>
        </div>
    </div>

</body>
</html>
